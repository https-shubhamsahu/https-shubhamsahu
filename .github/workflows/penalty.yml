name: Penalty shootout

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One run at a time. A queued run takes every open penalty issue, so a
# cancelled pending run loses no shots.
concurrency:
  group: penalty
  cancel-in-progress: false

jobs:
  shoot:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'penalty')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the shots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/penalty.py play
      - name: Commit the board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/penalty.json assets/readme/penalty.svg README.md
          git diff --staged --quiet || git commit -m "chore: penalty board"
          git pull --rebase
          git push
      - name: Reply on the issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/penalty.py reply
